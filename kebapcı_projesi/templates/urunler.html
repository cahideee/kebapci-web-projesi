<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{{ kategori.baslik }} - Adana Lezzet Kebapçısı</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;700&display=swap" rel="stylesheet">
    
    <style>
        body { font-family: 'Poppins', sans-serif; background-color: #f8f9fa; }
        .page-header {
            background-color: #e63946;
            color: white;
            padding: 40px 0;
            margin-bottom: 30px;
            border-bottom-left-radius: 50px;
            border-bottom-right-radius: 50px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.1);
        }
        .product-card {
            background: white;
            border: none;
            border-radius: 15px;
            padding: 20px;
            margin-bottom: 20px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            transition: 0.3s;
            border-left: 5px solid transparent;
        }
        .product-card:hover {
            border-left: 5px solid #e63946;
            transform: translateX(10px);
            box-shadow: 0 5px 15px rgba(0,0,0,0.05);
        }
        .price-tag {
            background-color: #f1faee;
            color: #1d3557;
            font-weight: bold;
            padding: 8px 15px;
            border-radius: 50px;
            font-size: 1.2rem;
        }
        .back-btn {
            color: white;
            text-decoration: none;
            font-weight: bold;
            display: inline-block;
            margin-bottom: 10px;
        }
    </style>
</head>
<body>

    <div class="page-header text-center">
        <div class="container">
            <a href="/" class="back-btn">⬅ Ana Sayfaya Dön</a>
            <h1 class="display-4 fw-bold">{{ kategori.baslik }}</h1>
        </div>
    </div>

    <div class="container">
        <div class="row justify-content-center">
            <div class="col-md-8">
                {% for urun in kategori.urunler %}
                <div class="product-card shadow-sm">
                    <div>
                        <h3 class="mb-0 fw-bold" style="color: #1d3557;">{{ urun.ad }}</h3>
                        <small class="text-muted">Özel Adana usulü hazırlanmıştır.</small>
                    </div>
                    <div class="text-end">
                        <div class="price-tag">{{ urun.fiyat }} TL</div>
                        <button class="btn btn-sm btn-outline-danger mt-2">Sepete Ekle</button>
                    </div>
                </div>
                {% endfor %}
            </div>
        </div>
    </div>

    <footer class="text-center py-4 text-muted">
        <p>Afiyet olsun!</p>
    </footer>

</body>
</html>
